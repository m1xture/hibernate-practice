<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

<div class="navbar">Registration and Login System</div>

<div class="container">
    <div class="card">
        <h2>Registration</h2>

        <form th:action="@{/auth/register}" th:object="${userDto}" method="post">

            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{username}" placeholder="Tom"/>
                <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}" placeholder="555 222-9685"/>
                <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="tom@mail.com"/>
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Password"/>
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div class="form-footer">
                <button type="submit" class="btn-primary">Register</button>
                <span>Already registered? <a th:href="@{/auth/login}">Login here</a></span>
            </div>

        </form>
    </div>
</div>

</body>
</html>

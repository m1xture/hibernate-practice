<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body>

<div class="navbar">Registration and Login System</div>

<div class="container">
    <div class="card">
        <h2>Login</h2>

        <div class="alert alert-error" th:if="${param.error}">
            Invalid username or password.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            You have been logged out.
        </div>

        <form th:action="@{/auth/login}" method="post">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Tom"/>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••"/>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn-primary">Login</button>
                <span>Not registered? <a th:href="@{/auth/register}">Register here</a></span>
            </div>

        </form>
    </div>
</div>

</body>
</html>
